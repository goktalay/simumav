<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SIMUMAV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19e6d2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#19e6d2"/>
      <stop offset="1" stop-color="#19e6d2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- ufuk ve arazi hissi -->
  <path d="M40 392 Q256 330 472 392" fill="none" stroke="url(#horizon)" stroke-width="4" opacity="0.9"/>
  <path d="M70 430 Q256 380 442 430" fill="none" stroke="url(#horizon)" stroke-width="2" opacity="0.4"/>
  <!-- hız izleri -->
  <g stroke-linecap="round" stroke-width="10">
    <path d="M60 212 L186 212" stroke="url(#streak)"/>
    <path d="M84 250 L176 250" stroke="url(#streak)" stroke-width="8"/>
    <path d="M110 288 L192 288" stroke="url(#streak)" stroke-width="6"/>
  </g>
  <!-- dron silueti: hafif yatışmış, hızda -->
  <g transform="translate(300 232) rotate(-14)" filter="url(#glow)">
    <!-- kollar -->
    <path d="M-92 -70 L92 70 M92 -70 L-92 70" stroke="#19e6d2" stroke-width="14" stroke-linecap="round"/>
    <!-- gövde -->
    <path d="M-46 -22 L46 -22 L62 0 L46 22 L-46 22 L-62 0 Z" fill="#0b1326" stroke="#19e6d2" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="12" fill="#ffb347"/>
    <!-- rotorlar -->
    <g fill="none" stroke="#19e6d2" stroke-width="9">
      <circle cx="-108" cy="-82" r="36"/>
      <circle cx="108" cy="-82" r="36"/>
      <circle cx="-108" cy="82" r="36"/>
      <circle cx="108" cy="82" r="36"/>
    </g>
    <g fill="#ffb347">
      <circle cx="-108" cy="-82" r="7"/>
      <circle cx="108" cy="-82" r="7"/>
      <circle cx="-108" cy="82" r="7"/>
      <circle cx="108" cy="82" r="7"/>
    </g>
  </g>
</svg>
