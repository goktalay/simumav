# cloudflared config.yml `ingress:` listesine eklenecek parça (son `service: http_status:404` satırının ÜSTÜNE).
# Sonra: systemctl restart cloudflared. DNS: Cloudflare panelde CNAME simumav.com ve www → <tünel-id>.cfargotunnel.com (proxied).
  - hostname: simumav.com
    service: unix:/run/hepgo/simumav.sock
    originRequest:
      noTLSVerify: true
      connectTimeout: 15s
  - hostname: www.simumav.com
    service: unix:/run/hepgo/simumav.sock
